name: Linux build test
# Manual only: tries the Linux build with several pinned Rust versions to find
# out why the release workflow's newest-stable Linux build fails to compile wry.
# Builds without tauri-action, so it never touches a release.
on:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.75.0', '1.80.0', '1.85.0']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci && npm run build

      - name: Build the app
        env:
          SQLX_OFFLINE: 'true'
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu
