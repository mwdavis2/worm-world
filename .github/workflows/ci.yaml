name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action creates the release and uploads the installers to it, which the
# default read-only GITHUB_TOKEN cannot do.
permissions:
  contents: write

jobs:
  release:
    # No macOS job: that build is made and signed locally, since CI holds no
    # Apple signing identity - an unsigned .dmg is blocked by Gatekeeper, so
    # building one here would only produce an artifact nobody should ship. The
    # signed .dmg is uploaded to the draft release by hand.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
          # Pinned to 22.04, not ubuntu-latest: Tauri 1.x builds against
          # webkit2gtk-4.0, which Ubuntu dropped in 24.04 (it ships 4.1 only).
          # Rust is pinned to 1.85.0 here: wry 0.23 does not compile against
          # webkit2gtk on the newest stable (checked 2026-10-29), while 1.85.0
          # builds, and the lockfile needs at least 1.85 (edition 2024).
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: 1.85.0
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Linux system dependencies
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
          cache: 'npm' # Set this to npm, yarn or pnpm.

      - name: Install web app dependencies
        run: npm ci # Change this to npm, yarn or pnpm.

      # - name: Run frontend tests
      #   run: npm run test-front

      # - name: Run backend tests
      #   run: npm run test-back

      - name: Build web
        # Remove `npm run build` if you build your frontend in `beforeBuildCommand`
        run: npm ci && npm run build

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }} # This only works if your workflow triggers on new tags.
          releaseName: 'WormWorld v__VERSION__' # tauri-action replaces \_\_VERSION\_\_ with the app version.
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
